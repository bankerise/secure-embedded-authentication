name: sea-core-android release gate

on:
  push:
    tags:
      - 'sea-core-android/*.*.*'

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sea-core-android/}" >> "$GITHUB_OUTPUT"

      # JitPack builds this module on demand, the first time a consumer
      # resolves the tag, by running the exact command in jitpack.yml's
      # `install:` step (see that file, and infra/README.md, for why it
      # goes through apps/demo-android rather than a root-level Gradle
      # project). Like the iOS release-gate workflow, this job never
      # publishes anywhere — it just fails the tag early if that on-demand
      # build would fail, instead of a consumer finding out first.
      - name: Build and publish to mavenLocal (mirrors JitPack's build)
        env:
          # JitPack sets VERSION to the tag being built, with "/" replaced
          # by "~" (see infra/README.md) — reproduce that exactly so the
          # artifact lands where a real JitPack-triggered build would put it.
          VERSION: sea-core-android~${{ steps.version.outputs.version }}
        run: cd apps/demo-android && sh gradlew :sea-core-android:publishToMavenLocal

      - name: Verify the published artifact landed at the expected coordinate
        run: |
          dir="$HOME/.m2/repository/com/github/bankerise/secure-embedded-authentication/sea-core-android/sea-core-android~${{ steps.version.outputs.version }}"
          test -d "$dir" || (echo "expected artifact directory not found: $dir" && exit 1)
          ls "$dir"
