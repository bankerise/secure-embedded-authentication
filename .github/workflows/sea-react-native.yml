name: sea-react-native npm publish

on:
  push:
    tags:
      - 'sea-react-native/*.*.*'

permissions:
  contents: read
  # npm provenance + trusted publishing (OIDC).
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22's bundled npm is older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Enable Corepack
        run: corepack enable

      - name: Pin Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sea-react-native/}" >> "$GITHUB_OUTPUT"

      - name: Update package version
        working-directory: packages/sea-react-native
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Typecheck and test
        working-directory: packages/sea-react-native
        run: yarn typecheck && yarn test

      - name: Build package
        working-directory: packages/sea-react-native
        run: yarn prepare

      # With a trusted publisher configured on npmjs.com, no token is needed
      # and NPM_TOKEN can be deleted. The token is still required for the
      # very first publish, before the package exists on npm.
      - name: Publish to npm
        working-directory: packages/sea-react-native
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
