server {
    listen 443 ssl;
    http2 on;
    server_name localhost auth.bank.local;

    ssl_certificate     /etc/nginx/tls/sea-dev.pem;
    ssl_certificate_key /etc/nginx/tls/sea-dev-key.pem;

    # Mirror the production TLS floor (spec §15): TLS 1.2 minimum, 1.3 preferred.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Apple App Site Association (spec §10.2): validates the
    # webcredentials:auth.bank.local associated domain so WKWebView will
    # route navigator.credentials.create/get for this origin to the
    # platform authenticator. Served directly by nginx, NOT proxied to
    # Keycloak — exact path match, no extension, no redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        alias /etc/nginx/well-known/apple-app-site-association;
    }

    location / {
        proxy_pass http://keycloak:8080;

        # Keycloak reads these (KC_PROXY_HEADERS=xforwarded) to mint https://
        # issuer, authorize and redirect URLs instead of http://.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_buffer_size   16k;
        proxy_buffers       8 16k;
    }
}
