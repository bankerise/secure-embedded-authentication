# Bankerise SEA mobile login theme — French overrides (spec §18.2 pt.6).
# Only keys we brand-customize are listed here; anything else falls back to
# the parent "base" theme's French bundle.

# Page <title> / header
loginTitle=Connexion à Bankerise
loginAccountTitle=Bon retour
seaLoginSubtitle=Connectez-vous pour accéder à votre compte Bankerise

# Sign-in button
doLogIn=Se connecter

# Username / email field
username=Nom d''utilisateur
usernameOrEmail=Nom d''utilisateur ou e-mail
email=E-mail
seaUsernameOrEmailPlaceholder=Nom d''utilisateur ou e-mail

# Password field
password=Mot de passe
seaPasswordPlaceholder=Saisissez votre mot de passe
showPassword=Afficher le mot de passe
hidePassword=Masquer le mot de passe

# Options / links
rememberMe=Se souvenir de moi
doForgotPassword=Mot de passe oublié ?

# Passkey CTA slot (deferred placeholder — see login.ftl)
seaPasskeyComingSoon=Connexion par clé d''accès (bientôt disponible)
seaOrDivider=ou connectez-vous avec un mot de passe

# Registration (only shown when the realm allows it)
noAccount=Nouvel utilisateur ?
doRegister=S''inscrire

# Misc
requiredFields=Champs obligatoires
restartLoginTooltip=Redémarrer la connexion

# Error strings we brand-tune (still generic — never reveal which of
# username/password was wrong)
invalidUserMessage=Nom d''utilisateur ou mot de passe incorrect.
