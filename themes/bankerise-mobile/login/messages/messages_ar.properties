# username/password was wrong)
invalidUserMessage=اسم المستخدم أو كلمة المرور غير صحيحة.
invalidPasswordMessage=كلمة المرور غير صحيحة.
accountDisabledMessage=حسابك معطّل. يرجى التواصل مع الدعم.
