# Bankerise SEA mobile login theme — Arabic overrides (spec §18.2 pt.6).
# Only keys we brand-customize are listed here; anything else falls back to
# the parent "base" theme's Arabic bundle. Rendered right-to-left
# (html dir="rtl", see template.ftl / locale.rtl).

# Page <title> / header
loginTitle=تسجيل الدخول إلى Bankerise
loginAccountTitle=مرحبًا بعودتك
seaLoginSubtitle=سجّل الدخول للمتابعة إلى حسابك في Bankerise

# Sign-in button
doLogIn=تسجيل الدخول

# Username / email field
username=اسم المستخدم
usernameOrEmail=اسم المستخدم أو البريد الإلكتروني
email=البريد الإلكتروني
seaUsernameOrEmailPlaceholder=اسم المستخدم أو البريد الإلكتروني

# Password field
password=كلمة المرور
seaPasswordPlaceholder=أدخل كلمة المرور
showPassword=إظهار كلمة المرور
hidePassword=إخفاء كلمة المرور

# Options / links
rememberMe=تذكرني
doForgotPassword=هل نسيت كلمة المرور؟

# Passkey CTA slot (deferred placeholder — see login.ftl)
