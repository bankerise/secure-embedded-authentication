# Bankerise SEA mobile login theme — English overrides (spec §18.2 pt.6).
# Only keys we brand-customize are listed here; anything else falls back to
# the parent "base" theme's message bundle (e.g. Keycloak's stock validation
# error copy for keys we don't touch), which keeps automatic localization
# working for flows we didn't explicitly restyle.

# Page <title> / header
loginTitle=Sign in to Bankerise
loginAccountTitle=Welcome back
seaLoginSubtitle=Sign in to continue to your Bankerise account

# Sign-in button
doLogIn=Sign in

# Username / email field
username=Username
usernameOrEmail=Username or email
email=Email
seaUsernameOrEmailPlaceholder=Username or email

# Password field
password=Password
seaPasswordPlaceholder=Enter your password
showPassword=Show password
hidePassword=Hide password

# Options / links
rememberMe=Remember me
doForgotPassword=Forgot password?

# Passkey CTA slot (deferred placeholder — see login.ftl)
seaPasskeyComingSoon=Passkey sign-in (coming soon)
seaOrDivider=or sign in with password

# Registration (only shown when the realm allows it)
noAccount=New user?
doRegister=Register

# Misc
requiredFields=Required fields
restartLoginTooltip=Restart login

# Error strings we brand-tune (still generic — never reveal which of
# username/password was wrong)
invalidUserMessage=Invalid username or password.
invalidPasswordMessage=Invalid password.
accountDisabledMessage=Your account is disabled. Please contact support.
