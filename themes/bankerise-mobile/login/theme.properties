parent=base
import=common/keycloak

# Bankerise SEA mobile login theme (spec §18.2). Single stylesheet, no web
# fonts / external requests — the WKWebView is app-bound-domain restricted.
styles=css/mobile.css

# Only expose the locales the realm actually supports; kept in sync with
# infra/provision-realm.sh's supportedLocales=["en","fr","ar"].
locales=en,fr,ar
