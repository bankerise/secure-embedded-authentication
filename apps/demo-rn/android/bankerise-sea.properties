# SEA (Secure Embedded Authentication) configuration for the demo app.
# These values are read at runtime by SEAPropertiesLoader and passed through
# to SEAConfig. Override with your own values before building.
#
# Keys:
#   authorizeUrl       – Full authorize URL (required; validated at session time)
#   callbackScheme     – Custom scheme for the callback redirect (§6.3)
#   authDomains        – Comma-separated list of allowed host domains
#   allowedPorts       – Comma-separated list of allowed ports (-1 = unset)
#   maxUrlLengthBytes  – Max byte length of the authorize URL string

# Custom scheme the callback redirect uses (§6.3).
callbackScheme=bkrmob

# Comma-separated list of allowed host domains (§7.3).
# Intersected with the compiled allowlist, never widens it.
authDomains=auth.bank.local,localhost,showcase-client-gw.demo.proxym-it.net,platform-keycloak.pres.proxym-it.net

# Comma-separated list of allowed ports for the authorize URL (§6.2).
# -1 means unset (standard HTTPS). Default: -1,443
allowedPorts=-1,443

# Maximum byte length of the authorize URL string (§6.2).
maxUrlLengthBytes=2048

# Comma-separated list of allowed URI schemes for the authorize URL (§6.2).
# Default: https only. Add http for local dev behind TLS-terminating reverse proxy.
allowedSchemes=http,https
