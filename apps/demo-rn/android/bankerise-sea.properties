# SEA (Secure Embedded Authentication) configuration for the demo app.
# These values are read at runtime by the demo-harness and passed through
# to sea-core-android's SEAConfig. Override to test different environments.

# Custom scheme the callback redirect uses (§6.3).
callbackScheme=bankerise-auth

# Comma-separated list of allowed host domains (§7.3).
# Intersected with the compiled allowlist, never widens it.
authDomains=auth.bank.local,localhost,showcase-client-gw.demo.proxym-it.net,platform-keycloak.pres.proxym-it.net

# Comma-separated list of allowed ports for the authorize URL (§6.2).
# -1 means unset (standard HTTPS). Default: -1,443
allowedPorts=-1,443

# Maximum byte length of the authorize URL string (§6.2).
maxUrlLengthBytes=2048
